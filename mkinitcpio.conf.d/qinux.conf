# mkinitcpio profiles for Qinux.
#
# One file per layout, dropped into /etc/mkinitcpio.conf.d/ by the base package.
# mkinitcpio merges every *.conf in that directory over mkinitcpio.conf, in
# lexical order, so the profile name must sort after the file it refines.
#
# The profile a user builds with is chosen by setting /etc/mkinitcpio.conf's
# default_image, or by naming the preset explicitly:
#
#   mkinitcpio -P linux-qinux

# --- The base system ------------------------------------------------------
#
# An encrypted root or a separate /boot needs the encrypt and sd-vconsole hooks,
# so the full profile is the default. A minimal one exists for the cases where
# the extra hooks only slow the boot down.

MODULES=(base)
HOOKS=(base microcode modconf kms keyboard keymap consolefont block filesystems fsck)
COMPRESSION="zstd"

# Modules are listed for a laptop with wifi, Bluetooth and a touchpad. Without
# them the display server starts before the input devices exist.
MODULES+=(iwd)

COMPRESSION_OPTS=("zstd" "-19" "--long")

# --- Hook notes -----------------------------------------------------------
#
# kms       loads the graphics driver before the display manager, so a machine
#           with no framebuffer console still shows a boot splash
# keymap    console keymap, so early panic messages are readable
# consolefont  a readable font for the same reason
# fsck      filesystem check after assembly
#
# Not enabled by default:
# encrypt   needed for LUKS; the installer adds it when encryption is chosen
# resume    needed for hibernate; harmless otherwise, one hook more to load
# autodetect  convenient but it reads the running system, which is wrong on a
#           chroot and makes the image non-reproducible. The installer adds it.

# --- Variants -------------------------------------------------------------

# A smaller image for systems that do not need the graphics and font hooks,
# for example a server or a rescue medium where the boot speed matters more
# than the boot splash.
#
#   mkinitcpio -P linux-qinux-lite